syntax = "proto3";

package knetpb;

option go_package = "github.com/KrigMoon/KNet/Proto/gen/knetpb";

enum Status {
  OFF     = 0;
  RUNNING = 1;
  ON      = 2;
  STOP    = 3;
}

enum RecordLevel {
  INFO = 0;
  WARNING = 1;
  ERROR = 2;
}

enum RecordCode {
  LIFECIRCLE = 0;
  DATA = 1;
  NET = 2;
  CommandCenter = 4;
}